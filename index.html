<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capacitaciones ETINAR</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23423D3B'/><rect x='26' y='30' width='20' height='20' rx='3' fill='%23F2B200'/><path d='M56 34h10v10h-10z M56 46h10v10h-10z' fill='%23ffffff'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --ink:#2C2A28; --charcoal:#423D3B; --muted:#8C857E; --muted2:#6B655F;
  --line:#E6E2DD; --line-soft:#EDE9E4;
  --gold:#F2B200; --gold-deep:#B8791A; --gold-soft:#FBF6E8;
  --paper:#FAF9F7; --paper2:#F4F2EE; --card:#FFFFFF;
  --green:#2E7D52; --green-soft:#E7F3EC;
  --red:#C0392B; --red-soft:#FBEBE9;
  --blue:#2F6FB0; --blue-soft:#E8F0F8;
  --purple:#7A5AB0; --purple-soft:#F0EAF7;
  --sidebar:#37332F;
  --shadow:0 1px 2px rgba(44,42,40,.05),0 8px 24px rgba(44,42,40,.06);
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
  background:var(--paper); color:var(--ink);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Fraunces',Georgia,serif; font-weight:500; margin:0; color:var(--charcoal); letter-spacing:-.01em}
button{font-family:inherit; cursor:pointer}
input,select,textarea{font-family:inherit; font-size:15px}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- LOGO ---------- */
.logo{display:flex; align-items:center; gap:11px}
.logo .mark{width:34px;height:34px;background:var(--gold);border-radius:6px;position:relative;flex:none}
.logo .mark::after{content:"";position:absolute;right:5px;top:5px;width:9px;height:9px;background:#fff;box-shadow:0 12px 0 #fff}
.logo .word{font-family:'Hanken Grotesk',sans-serif;font-weight:700;letter-spacing:.14em;font-size:19px}
.logo .r{font-size:9px;vertical-align:super;opacity:.7;margin-left:1px}

/* ---------- LOGIN ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(1200px 600px at 20% -10%,#4a443f 0,var(--charcoal) 55%,#2b2724 100%)}
.login-card{background:var(--card);border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.28);
  width:100%;max-width:410px;padding:38px 34px;text-align:center}
.login-card .logo{justify-content:center;margin-bottom:6px}
.login-card .logo .word{color:var(--charcoal)}
.login-sub{color:var(--muted);font-size:14px;margin:2px 0 26px}
.login-card h1{font-size:26px;margin-bottom:4px}
.field{text-align:left;margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted2);margin-bottom:6px;letter-spacing:.01em}
.field input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:var(--paper);transition:border-color .15s}
.field input:focus{border-color:var(--gold);outline:none;background:#fff}
.btn-primary{background:var(--charcoal);color:#fff;border:none;padding:13px 18px;border-radius:11px;font-weight:600;font-size:15px;width:100%;transition:transform .08s,background .15s}
.btn-primary:hover{background:#2b2724}
.btn-primary:active{transform:scale(.99)}
.login-demo{margin-top:18px;font-size:13px;color:var(--muted)}
.login-demo b{color:var(--gold-deep)}

/* ---------- LAYOUT ---------- */
.app{display:none;min-height:100vh}
.app.on{display:grid;grid-template-columns:266px 1fr}
.sidebar{background:var(--sidebar);color:#e9e5e0;min-height:100vh;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
.sidebar .brand{padding:20px 20px 16px}
.sidebar .brand .word{color:#fff}
.sidebar .brand .tag{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-top:10px;font-weight:600}
.nav-group{padding:6px 12px}
.nav-label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#9a938c;padding:14px 10px 7px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#cfc9c2;cursor:pointer;font-size:14.5px;font-weight:500;transition:background .13s,color .13s;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:var(--gold);color:#3a3430;font-weight:600}
.nav-item .ic{width:18px;height:18px;flex:none;opacity:.85}
.nav-item.active .ic{opacity:1}
.dept-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:#cfc9c2;cursor:pointer;font-size:14px;transition:background .13s,color .13s;border:none;background:none;width:100%;text-align:left}
.dept-item:hover{background:rgba(255,255,255,.06);color:#fff}
.dept-item.active{background:rgba(242,178,0,.16);color:#fff}
.dept-dot{width:9px;height:9px;border-radius:50%;flex:none}
.dept-item .count{margin-left:auto;font-size:11.5px;background:rgba(255,255,255,.1);padding:1px 8px;border-radius:20px;color:#e9e5e0}
.sidebar-foot{margin-top:auto;padding:16px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#9a938c}

/* ---------- MAIN ---------- */
.main{min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:16px;padding:16px 30px;border-bottom:1px solid var(--line);background:rgba(250,249,247,.85);backdrop-filter:blur(6px);position:sticky;top:0;z-index:20}
.topbar h1{font-size:22px}
.topbar .crumb{font-size:12.5px;color:var(--muted);letter-spacing:.02em}
.topbar-spacer{flex:1}
.save-pill{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted2);background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:20px}
.save-dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.user-chip{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);padding:5px 12px 5px 5px;border-radius:20px;font-size:13.5px;font-weight:600;color:var(--charcoal)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--charcoal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.hamb{display:none;background:none;border:1px solid var(--line);border-radius:10px;padding:8px;line-height:0}
.content{padding:28px 30px 60px;max-width:1240px;width:100%;margin:0 auto;flex:1}

/* ---------- KPI CARDS ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:26px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .k-label{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.01em}
.kpi .k-val{font-family:'Fraunces',serif;font-size:34px;font-weight:500;color:var(--charcoal);margin-top:6px;line-height:1}
.kpi .k-val small{font-size:16px;color:var(--muted)}
.kpi .k-sub{font-size:12px;color:var(--muted2);margin-top:7px}
.kpi .k-ic{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center}

/* ---------- PANELS ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:22px}
.panel-h{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.panel-h h2{font-size:19px}
.panel-h .sub{font-size:12.5px;color:var(--muted)}
.panel-h .r{margin-left:auto}
.two-col{display:grid;grid-template-columns:1.35fr 1fr;gap:22px}
@media(max-width:900px){.two-col{grid-template-columns:1fr}}
.chart-box{position:relative;height:280px}
.chart-box.sm{height:230px}

/* ---------- CHIPS / BADGES ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 11px;border-radius:20px;letter-spacing:.01em}
.chip.plan{background:var(--blue-soft);color:var(--blue)}
.chip.ok{background:var(--green-soft);color:var(--green)}
.chip.late{background:var(--red-soft);color:var(--red)}
.chip.soon{background:var(--gold-soft);color:var(--gold-deep)}
.chip-dot{width:7px;height:7px;border-radius:50%;background:currentColor}

/* ---------- BUTTONS ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);color:var(--charcoal);padding:9px 14px;border-radius:10px;font-size:13.5px;font-weight:600;transition:background .13s,border-color .13s,transform .08s}
.btn:hover{background:var(--paper2);border-color:#d8d2ca}
.btn:active{transform:scale(.98)}
.btn.dark{background:var(--charcoal);color:#fff;border-color:var(--charcoal)}
.btn.dark:hover{background:#2b2724}
.btn.gold{background:var(--gold);color:#3a3430;border-color:var(--gold)}
.btn.gold:hover{filter:brightness(.97)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--paper2)}
.btn .ic{width:16px;height:16px}

/* ---------- DEPT HEADER ---------- */
.dept-head{display:flex;align-items:flex-start;gap:18px;margin-bottom:24px}
.dept-badge{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Fraunces',serif;font-size:24px;flex:none}
.dept-head .meta h1{font-size:26px}
.dept-head .meta p{color:var(--muted);font-size:13.5px;margin:4px 0 0}
.ring-wrap{margin-left:auto;text-align:center;flex:none}
.ring{position:relative;width:88px;height:88px}
.ring svg{transform:rotate(-90deg)}
.ring .ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .ring-txt b{font-family:'Fraunces',serif;font-size:22px;color:var(--charcoal);line-height:1}
.ring .ring-txt span{font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

/* ---------- TRAINING CARD ---------- */
.cap-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;transition:border-color .13s}
.cap-card:hover{border-color:#d8d2ca}
.cap-top{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer}
.cap-top .accent{width:4px;align-self:stretch;border-radius:4px;flex:none;min-height:38px}
.cap-title{font-family:'Fraunces',serif;font-size:17px;color:var(--charcoal);font-weight:500}
.cap-mini{display:flex;flex-wrap:wrap;gap:14px;margin-top:5px;font-size:12.5px;color:var(--muted2)}
.cap-mini span{display:inline-flex;align-items:center;gap:5px}
.cap-mini .ic{width:14px;height:14px;opacity:.7}
.cap-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.chev{width:18px;height:18px;color:var(--muted);transition:transform .18s}
.cap-card.open .chev{transform:rotate(180deg)}
.cap-body{display:none;padding:4px 18px 20px;border-top:1px solid var(--line-soft)}
.cap-card.open .cap-body{display:block}
.cap-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:16px 0}
.info-cell{background:var(--paper);border:1px solid var(--line-soft);border-radius:11px;padding:11px 13px}
.info-cell .il{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:5px}
.info-cell .iv{font-size:14.5px;color:var(--charcoal);margin-top:4px;font-weight:500}
.legal-box{background:var(--gold-soft);border:1px solid #efe2c4;border-left:3px solid var(--gold);border-radius:11px;padding:13px 15px;margin:6px 0 4px}
.legal-box .lh{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--gold-deep);font-weight:700;display:flex;align-items:center;gap:6px}
.legal-box p{margin:6px 0 0;font-size:13.5px;color:#5b4a2a;line-height:1.55}
.legal-note{font-size:11px;color:var(--muted);font-style:italic;margin-top:7px}

.sec-title{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted2);font-weight:700;margin:18px 0 10px;display:flex;align-items:center;gap:7px}
.att-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px}
.att-row:last-child{border-bottom:none}
.att-sex{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.sex-m{background:var(--blue)} .sex-f{background:var(--purple)}
.att-cargo{margin-left:auto;color:var(--muted);font-size:12.5px}

.file-grid{display:flex;flex-wrap:wrap;gap:10px}
.file-item{display:flex;align-items:center;gap:9px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--charcoal);max-width:230px}
.file-item .thumb{width:34px;height:34px;border-radius:7px;object-fit:cover;flex:none;border:1px solid var(--line)}
.file-item .fic{width:30px;height:30px;border-radius:7px;background:var(--paper2);display:flex;align-items:center;justify-content:center;flex:none}
.file-item .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-item .rm{margin-left:4px;color:var(--muted);background:none;border:none;padding:2px}
.file-empty{font-size:13px;color:var(--muted);font-style:italic}
.upload-btns{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0 4px}

/* ---------- CALENDAR ---------- */
.cal-head{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-title{font-family:'Fraunces',serif;font-size:22px;color:var(--charcoal);min-width:200px}
.icon-btn{width:38px;height:38px;border:1px solid var(--line);background:var(--card);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--charcoal)}
.icon-btn:hover{background:var(--paper2)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;padding:4px 0}
.cal-cell{background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:104px;padding:8px;position:relative}
.cal-cell.other{background:var(--paper2);opacity:.55}
.cal-cell.today{border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,178,0,.18)}
.cal-day{font-size:13px;font-weight:600;color:var(--muted2);margin-bottom:5px}
.cal-cell.today .cal-day{color:var(--gold-deep)}
.cal-ev{display:block;width:100%;text-align:left;border:none;border-radius:7px;padding:5px 8px;margin-bottom:5px;font-size:11.5px;font-weight:600;cursor:pointer;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-ev.plan{background:var(--blue-soft);color:var(--blue)}
.cal-ev.ok{background:var(--green-soft);color:var(--green)}
.cal-ev.late{background:var(--red-soft);color:var(--red)}
.cal-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:12.5px;color:var(--muted2)}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.lg-dot{width:11px;height:11px;border-radius:3px}
@media(max-width:720px){.cal-cell{min-height:70px}.cal-ev{font-size:0;padding:4px}.cal-ev::before{content:"●";font-size:11px}}

/* ---------- TABLES ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line-soft);color:var(--charcoal)}
.tbl tr:last-child td{border-bottom:none}
.tbl .mono{font-family:ui-monospace,monospace;font-size:12.5px;color:var(--muted2)}

/* ---------- CONFIG ---------- */
.cfg-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:820px){.cfg-grid{grid-template-columns:1fr}}
.list-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.list-row:last-child{border-bottom:none}
.list-row .nm{font-weight:600;color:var(--charcoal)}
.list-row .rr{margin-left:auto;display:flex;gap:6px}
.tinybtn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 9px;font-size:12px;color:var(--muted2)}
.tinybtn:hover{background:var(--paper2);color:var(--charcoal)}

/* ---------- MODAL ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(44,42,40,.5);backdrop-filter:blur(3px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:34px 16px;overflow-y:auto}
.modal-bg.on{display:flex}
.modal{background:var(--card);border-radius:20px;width:100%;max-width:560px;box-shadow:0 30px 70px rgba(0,0,0,.3);animation:pop .18s ease}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal-h{display:flex;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:20px}
.modal-h .x{margin-left:auto;background:none;border:none;color:var(--muted);padding:4px;line-height:0}
.modal-b{padding:22px 24px;max-height:65vh;overflow-y:auto}
.modal-f{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.form-row{margin-bottom:15px}
.form-row.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-row label{display:block;font-size:12.5px;font-weight:600;color:var(--muted2);margin-bottom:6px}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);transition:border-color .13s}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--gold);outline:none;background:#fff}
.form-row textarea{resize:vertical;min-height:80px;line-height:1.5}

/* ---------- TOAST ---------- */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--charcoal);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 12px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:200;display:flex;align-items:center;gap:9px}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .ei{width:44px;height:44px;margin:0 auto 12px;opacity:.4}

@media(max-width:820px){
  .app.on{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;width:270px;z-index:60;transform:translateX(-100%);transition:transform .22s;box-shadow:8px 0 40px rgba(0,0,0,.25)}
  .sidebar.open{transform:none}
  .hamb{display:inline-flex}
  .content{padding:20px 16px 60px}
  .topbar{padding:14px 16px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none}
  .scrim.on{display:block}
  .two-col{grid-template-columns:1fr}
  .dept-head{flex-wrap:wrap}.ring-wrap{margin-left:0}
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div class="login-wrap" id="login">
  <div class="login-card">
    <div class="logo"><div class="mark"></div><div class="word">ETINAR<span class="r">&reg;</span></div></div>
    <div class="login-sub">Gestión de Capacitaciones · SST</div>
    <h1>Bienvenido</h1>
    <p class="login-sub" style="margin:2px 0 22px">Ingresa con tu usuario asignado</p>
    <div class="field"><label>Correo</label><input id="li-user" type="email" placeholder="tucorreo@etinar.com" value="admin@etinar.com"></div>
    <div class="field"><label>Contraseña</label><input id="li-pass" type="password" placeholder="••••••••" value="demo"></div>
    <button class="btn-primary" id="li-btn">Entrar</button>

/* ========================================================
   ESTADO Y HELPERS
======================================================== */
const state = { view:'dashboard', deptId:null, calY:2026, calM:6, user:DB.usuarios[0] };
let charts = {};

function estadoReal(c){
  if(c.estado==='ejecutada') return 'ok';
  const f = new Date(c.fecha+'T00:00:00');
  if(f < HOY) return 'late';
  const diff = (f - HOY)/(1000*60*60*24);
  if(diff <= 21) return 'soon';
  return 'plan';
}
const ESTADO_TXT = {ok:'Ejecutada', late:'Vencida', soon:'Próxima', plan:'Planificada'};
function fmtFecha(s){ if(!s) return '—'; const d=new Date(s+'T00:00:00'); return d.toLocaleDateString('es-EC',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDur(m){ const h=Math.floor(m/60), mm=m%60; return (h?h+' h ':'')+(mm?mm+' min':(h?'':'0 min')); }
function deptById(id){ return DB.departamentos.find(d=>d.id===id); }
function obraById(id){ return DB.obras.find(o=>o.id===id); }
function capsDept(id){ return DB.capacitaciones.filter(c=>c.deptId===id); }
function initials(n){ return n.split(' ').filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase(); }

function kpisDept(id){
  const list = capsDept(id);
  const total=list.length, ejec=list.filter(c=>c.estado==='ejecutada').length;
  const pct = total? Math.round(ejec/total*100):0;
  let h=0,m=0,f=0,horas=0;
  list.filter(c=>c.estado==='ejecutada').forEach(c=>{ c.asistentes.forEach(a=>{ a.sexo==='M'?h++:f++; }); horas += c.dur*c.asistentes.length; });
  return {total,ejec,pct,pers:h+f,h,m:f,horasHombre:Math.round(horas/60)};
}
function kpisGlobal(){
  const total=DB.capacitaciones.length;
  const ejec=DB.capacitaciones.filter(c=>c.estado==='ejecutada').length;
  const venc=DB.capacitaciones.filter(c=>estadoReal(c)==='late').length;
  let h=0,f=0,horas=0;
  DB.capacitaciones.filter(c=>c.estado==='ejecutada').forEach(c=>{ c.asistentes.forEach(a=>{ a.sexo==='M'?h++:f++; }); horas+=c.dur*c.asistentes.length; });
  return {total,ejec,venc,pct:total?Math.round(ejec/total*100):0,pers:h+f,h,f,horasHombre:Math.round(horas/60)};
}

function kpi(label,val,sub,icon,bg,fg){
  return '<div class="kpi"><div class="k-ic" style="background:'+bg+';color:'+fg+'">'+svg(icon)+'</div>'+

function proximasHTML(){
  const prox = DB.capacitaciones.filter(c=>c.estado!=='ejecutada').sort((a,b)=>a.fecha<b.fecha?-1:1).slice(0,5);

  return '<table class="tbl"><thead><tr><th>Capacitación</th><th>Departamento</th><th>Fecha</th><th>Estado</th><th></th></tr></thead><tbody>'+
    prox.map(c=>{ const d=deptById(c.deptId), e=estadoReal(c);

function cell(icon,label,val){ return '<div class="info-cell"><div class="il">'+svg(icon)+label+'</div><div class="iv">'+val+'</div></div>'; }

function filesSection(tipo,label,c,icon){
  const files=c.adjuntos.filter(a=>a.tipo===tipo);
  let html='<div class="sec-title">'+svg(icon)+label+' ('+files.length+')'+
    '<button class="btn sm ghost" style="margin-left:auto" data-upload="'+c.id+'|'+tipo+'">'+svg('plus','ic')+'Adjuntar</button></div>';
  html+='<div class="file-grid">';
  if(!files.length){ html+='<span class="file-empty">Sin archivos adjuntos.</span>'; }
  else files.forEach((f,i)=>{
    const idx=c.adjuntos.indexOf(f);
    const thumb = f.url && /\.(jpg|jpeg|png|webp|gif)$/i.test(f.nombre)
      ? '<img class="thumb" src="'+f.url+'" alt="">'
      : '<span class="fic">'+svg(icon)+'</span>';
    html+='<div class="file-item">'+thumb+'<span class="fname">'+f.nombre+'</span>'+
      '<button class="rm" data-rmfile="'+c.id+'|'+idx+'" title="Quitar">'+svg('trash','ic')+'</button></div>';
  });
  html+='</div>';
  return html;
}

function drawCalendar(){
  const y=state.calY, m=state.calM;
  const meses=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  document.getElementById('calTitle').textContent=meses[m]+' '+y;
  const first=new Date(y,m,1), start=(first.getDay()+6)%7; // lunes=0
  const days=new Date(y,m+1,0).getDate();
  const dow=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  let cells=dow.map(d=>'<div class="cal-dow">'+d+'</div>').join('');
  const filter=state.deptId;

  for(let i=0;i<start;i++) cells+='<div class="cal-cell other"></div>';
  for(let day=1;day<=days;day++){
    const dstr=y+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    const isToday=(iso(HOY)===dstr);
    let evs=DB.capacitaciones.filter(c=>c.fecha===dstr && (!filter||c.deptId===filter));
    let evHTML=evs.map(c=>{ const e=estadoReal(c); const cls=e==='soon'?'plan':e; const color=e==='soon'?'gold':e;
      return '<button class="cal-ev '+cls+'" data-open-dept="'+c.deptId+'" data-cap="'+c.id+'" title="'+c.nombre+'">'+c.nombre+'</button>';
    }).join('');
    cells+='<div class="cal-cell'+(isToday?' today':'')+'"><div class="cal-day">'+day+'</div>'+evHTML+'</div>';
  }
  document.getElementById('calGrid').innerHTML=cells;
}

function destroyCharts(){ Object.values(charts).forEach(c=>c&&c.destroy()); charts={}; }
function drawCharts(){
  destroyCharts();
  Chart.defaults.font.family="'Hanken Grotesk',sans-serif";
  Chart.defaults.color='#8C857E';

  const dctx=document.getElementById('chDept');
  if(dctx){
    charts.dept=new Chart(dctx,{type:'bar',data:{
      labels:DB.departamentos.map(d=>d.nombre.length>18?d.nombre.slice(0,17)+'…':d.nombre),
      datasets:[
        {label:'Ejecutadas',data:DB.departamentos.map(d=>kpisDept(d.id).ejec),backgroundColor:'#2E7D52',borderRadius:6,barPercentage:.62},
        {label:'Planificadas',data:DB.departamentos.map(d=>kpisDept(d.id).total-kpisDept(d.id).ejec),backgroundColor:'#E0DBD4',borderRadius:6,barPercentage:.62}
      ]},
      options:{maintainAspectRatio:false,responsive:true,plugins:{legend:{position:'bottom',labels:{usePointStyle:true,pointStyle:'circle',padding:16,boxWidth:8}}},
        scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,beginAtZero:true,ticks:{stepSize:1},grid:{color:'#EDE9E4'}}}}});
  }
  const sctx=document.getElementById('chSex');
  if(sctx){ const g=kpisGlobal();
    charts.sex=new Chart(sctx,{type:'doughnut',data:{labels:['Hombres','Mujeres'],datasets:[{data:[g.h,g.f],backgroundColor:['#2F6FB0','#7A5AB0'],borderWidth:0,cutout:'68%'}]},
      options:{maintainAspectRatio:false,responsive:true,plugins:{legend:{display:false}}}});
  }
  const mctx=document.getElementById('chMes');
  if(mctx){
    const meses=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    const dataE=new Array(12).fill(0), dataP=new Array(12).fill(0);
    DB.capacitaciones.forEach(c=>{ const mo=parseInt(c.fecha.slice(5,7))-1; if(c.estado==='ejecutada') dataE[mo]++; else dataP[mo]++; });
    charts.mes=new Chart(mctx,{type:'line',data:{labels:meses,datasets:[
      {label:'Ejecutadas',data:dataE,borderColor:'#2E7D52',backgroundColor:'rgba(46,125,82,.08)',fill:true,tension:.35,pointRadius:4,pointBackgroundColor:'#2E7D52'},
      {label:'Planificadas',data:dataP,borderColor:'#F2B200',backgroundColor:'rgba(242,178,0,.08)',fill:true,tension:.35,pointRadius:4,pointBackgroundColor:'#F2B200',borderDash:[5,4]}
    ]},options:{maintainAspectRatio:false,responsive:true,plugins:{legend:{position:'bottom',labels:{usePointStyle:true,pointStyle:'circle',padding:16,boxWidth:8}}},
      scales:{x:{grid:{display:false}},y:{beginAtZero:true,ticks:{stepSize:1},grid:{color:'#EDE9E4'}}}}});
  }
}

  const obraOpts=DB.obras.map(o=>'<option value="'+o.id+'"'+(o.id===c.obraId?' selected':'')+'>'+o.nombre+'</option>').join('');

    '<div class="form-row"><label>Nombre de la capacitación</label><input id="f-nombre" value="'+esc(c.nombre)+'"></div>'+
    '<div class="form-row two"><div><label>Fecha planificada</label><input id="f-fecha" type="date" value="'+c.fecha+'"></div>'+
      '<div><label>Duración (minutos)</label><input id="f-dur" type="number" min="15" step="15" value="'+c.dur+'"></div></div>'+
    '<div class="form-row"><label>Responsable de dictar</label><input id="f-resp" value="'+esc(c.resp)+'"></div>'+
    '<div class="form-row two"><div><label>Lugar / sala / área</label><input id="f-lugar" value="'+esc(c.lugar)+'"></div>'+
      '<div><label>Obra</label><select id="f-obra">'+obraOpts+'</select></div></div>'+
    '<div class="form-row"><label>Marco legal / normativa</label><textarea id="f-marco">'+esc(c.marco)+'</textarea></div>',
    '<button class="btn" data-close="1">Cancelar</button><button class="btn dark" data-save-cap="'+c.id+'">'+svg('save','ic')+'Guardar cambios</button>');
}
function addCapModal(deptId){
  const obraOpts=DB.obras.map(o=>'<option value="'+o.id+'">'+o.nombre+'</option>').join('');
  openModal('Nueva capacitación','plus',
    '<div class="form-row"><label>Nombre de la capacitación</label><input id="f-nombre" placeholder="Ej. Trabajo seguro en altura"></div>'+
    '<div class="form-row two"><div><label>Fecha planificada</label><input id="f-fecha" type="date" value="'+iso(HOY)+'"></div>'+
      '<div><label>Duración (minutos)</label><input id="f-dur" type="number" min="15" step="15" value="90"></div></div>'+
    '<div class="form-row"><label>Responsable de dictar</label><input id="f-resp" placeholder="Nombre del facilitador"></div>'+
    '<div class="form-row two"><div><label>Lugar / sala / área</label><input id="f-lugar" placeholder="Ej. Sala de capacitación"></div>'+
      '<div><label>Obra</label><select id="f-obra">'+obraOpts+'</select></div></div>'+
    '<div class="form-row"><label>Marco legal / normativa</label><textarea id="f-marco" placeholder="Norma o artículo que respalda la capacitación"></textarea></div>',
    '<button class="btn" data-close="1">Cancelar</button><button class="btn gold" data-create-cap="'+deptId+'">'+svg('plus','ic')+'Crear capacitación</button>');
}
function addAttModal(capId){
  openModal('Agregar asistente','users',
    '<div class="form-row two"><div><label>Cédula</label><input id="a-ced" placeholder="0912345678"></div>'+
      '<div><label>Sexo</label><select id="a-sex"><option value="M">Masculino</option><option value="F">Femenino</option></select></div></div>'+
    '<div class="form-row"><label>Nombres y apellidos</label><input id="a-nom" placeholder="Apellidos Nombres"></div>'+
    '<div class="form-row"><label>Cargo</label><input id="a-cargo" placeholder="Ej. Albañil"></div>',
    '<button class="btn" data-close="1">Cancelar</button><button class="btn dark" data-save-att="'+capId+'">'+svg('plus','ic')+'Agregar</button>');
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ========================================================
   TOAST + ESTADO DE GUARDADO
======================================================== */
let toastT;
function toast(msg,icon){
  const t=document.getElementById('toast');
  t.innerHTML=(icon?svg(icon,'ic'):'')+'<span>'+msg+'</span>';
  t.classList.add('on'); clearTimeout(toastT);
  toastT=setTimeout(()=>t.classList.remove('on'),2200);
}
function markSaved(){
  const p=document.getElementById('savepill');
  p.innerHTML='<span class="save-dot" style="background:var(--gold)"></span><span>Guardando…</span>';
  setTimeout(()=>{ p.innerHTML='<span class="save-dot"></span><span>Guardado</span>'; },550);
}

/* ========================================================
   ROUTER
======================================================== */
function route(){
  destroyCharts();
  document.querySelectorAll('.sidebar .nav-item,.dept-item').forEach(b=>b.classList.remove('active'));
  if(state.view==='dashboard') renderDashboard();
  else if(state.view==='dept') renderDept();
  else if(state.view==='calendario') renderCal();
  else if(state.view==='config') renderConfig();
  renderSidebar();
  window.scrollTo(0,0);
}

/* ========================================================
   EVENTOS (delegación)
======================================================== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-nav],[data-dept],[data-toggle],[data-edit],[data-exec],[data-unexec],[data-add-cap],[data-add-att],[data-upload],[data-rmfile],[data-save-cap],[data-create-cap],[data-save-att],[data-close],[data-cal],[data-open-dept],[data-backup],[data-add-dept],[data-edit-dept],[data-add-obra],[data-edit-obra],[data-add-user],[data-edit-user],[data-edit-empresa]');
  if(!t) return;

  // navegación principal
  if(t.dataset.nav){ state.view=t.dataset.nav; if(t.dataset.nav!=='dept'){} closeSidebar(); route(); return; }
  if(t.dataset.dept){ state.view='dept'; state.deptId=t.dataset.dept; closeSidebar(); route(); return; }
  if(t.dataset.openDept){ state.view='dept'; state.deptId=t.dataset.openDept; route();
    if(t.dataset.cap) setTimeout(()=>{ const card=document.querySelector('[data-card="'+t.dataset.cap+'"]'); if(card){card.classList.add('open'); card.scrollIntoView({behavior:'smooth',block:'center'});} },60);
    return; }

  // expandir tarjeta
  if(t.dataset.toggle){ const card=document.querySelector('[data-card="'+t.dataset.toggle+'"]'); card.classList.toggle('open'); return; }

  // editar / crear capacitación
  if(t.dataset.edit){ editCapModal(cap(t.dataset.edit)); return; }
  if(t.dataset.addCap){ addCapModal(t.dataset.addCap); return; }
  if(t.dataset.saveCap){ saveCap(t.dataset.saveCap); return; }
  if(t.dataset.createCap){ createCap(t.dataset.createCap); return; }

  // ejecutar / revertir
  if(t.dataset.exec){ const c=cap(t.dataset.exec); c.estado='ejecutada'; c.fechaEjec=iso(HOY); markSaved(); route(); reopen(c.id); toast('Capacitación marcada como ejecutada','check'); return; }
  if(t.dataset.unexec){ const c=cap(t.dataset.unexec); c.estado='planificada'; c.fechaEjec=null; markSaved(); route(); reopen(c.id); toast('Marcada como pendiente','cal'); return; }

  // asistentes
  if(t.dataset.addAtt){ addAttModal(t.dataset.addAtt); return; }
  if(t.dataset.saveAtt){ saveAtt(t.dataset.saveAtt); return; }

  // archivos
  if(t.dataset.upload){ triggerUpload(t.dataset.upload); return; }
  if(t.dataset.rmfile){ const [cid,idx]=t.dataset.rmfile.split('|'); cap(cid).adjuntos.splice(+idx,1); markSaved(); route(); reopen(cid); toast('Archivo quitado','trash'); return; }

  // calendario
  if(t.dataset.cal){ let m=state.calM+parseInt(t.dataset.cal); let y=state.calY; if(m<0){m=11;y--;} if(m>11){m=0;y++;} state.calM=m; state.calY=y; drawCalendar(); return; }

  // respaldo
  if(t.dataset.backup){ backup(); return; }

  // configuración (placeholders informativos)
  if(t.dataset.addDept||t.dataset.editDept){ toast('La gestión de departamentos se conecta a la base real 🔜','cfg'); return; }
  if(t.dataset.addObra||t.dataset.editObra){ toast('La gestión de obras se conecta a la base real 🔜','cfg'); return; }
  if(t.dataset.addUser||t.dataset.editUser){ toast('Los usuarios y contraseñas se crean con Supabase 🔜','users'); return; }
  if(t.dataset.editEmpresa){ toast('Edición disponible al conectar la base 🔜','edit'); return; }

  if(t.dataset.close){ closeModal(); return; }
});
document.addEventListener('change',e=>{
  if(e.target.id==='calFilter'){ state.deptId=e.target.value||null; drawCalendar(); }
});

function cap(id){ return DB.capacitaciones.find(c=>c.id===id); }
function reopen(id){ const card=document.querySelector('[data-card="'+id+'"]'); if(card) card.classList.add('open'); }

function saveCap(id){
  const c=cap(id);
  c.nombre=val('f-nombre')||c.nombre; c.fecha=val('f-fecha')||c.fecha; c.dur=parseInt(val('f-dur'))||c.dur;
  c.resp=val('f-resp')||c.resp; c.lugar=val('f-lugar')||c.lugar; c.obraId=val('f-obra')||c.obraId; c.marco=val('f-marco')||c.marco;
  closeModal(); markSaved(); route(); reopen(id); toast('Cambios guardados','check');
}
function createCap(deptId){
  const nombre=val('f-nombre'); if(!nombre){ toast('Escribe el nombre de la capacitación'); return; }
  const id='c'+Date.now();
  DB.capacitaciones.push({id,deptId,obraId:val('f-obra'),nombre,marco:val('f-marco')||'Por definir.',fecha:val('f-fecha'),dur:parseInt(val('f-dur'))||90,resp:val('f-resp')||'Por asignar',lugar:val('f-lugar')||'Por definir',estado:'planificada',fechaEjec:null,asistentes:[],adjuntos:[]});
  closeModal(); markSaved(); route(); reopen(id); toast('Capacitación creada','plus');
}
function saveAtt(capId){
  const ced=val('a-ced'),nom=val('a-nom'),sex=val('a-sex'),cargo=val('a-cargo');
  if(!nom){ toast('Escribe el nombre del asistente'); return; }
  cap(capId).asistentes.push({cedula:ced||'—',nombre:nom,sexo:sex,cargo:cargo||'—'});
  closeModal(); markSaved(); route(); reopen(capId); toast('Asistente agregado','users');
}
function val(id){ const el=document.getElementById(id); return el?el.value.trim():''; }

/* subida de archivos (demo: guarda nombre + preview local) */
function triggerUpload(data){
  const [cid,tipo]=data.split('|');
  const inp=document.createElement('input'); inp.type='file'; inp.multiple=true;
  if(tipo==='foto') inp.accept='image/*';
  inp.onchange=()=>{ [...inp.files].forEach(f=>{
      const item={tipo,nombre:f.name};
      if(f.type.startsWith('image/')) item.url=URL.createObjectURL(f);
      cap(cid).adjuntos.push(item);
    });
    markSaved(); route(); reopen(cid);
    toast(inp.files.length+' archivo(s) adjuntado(s)','check');
  };
  inp.click();
}

/* respaldo manual */
function backup(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='respaldo_capacitaciones_'+iso(HOY)+'.json'; a.click();
  toast('Respaldo descargado','down');
}

/* ========================================================
   SIDEBAR MÓVIL + LOGIN
======================================================== */
function openSidebar(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('scrim').classList.add('on'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('scrim').classList.remove('on'); }
document.getElementById('hamb').addEventListener('click',openSidebar);
document.getElementById('scrim').addEventListener('click',closeSidebar);

function login(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').classList.add('on');
  state.view='dashboard'; route();
}
document.getElementById('li-btn').addEventListener('click',login);
document.getElementById('li-pass').addEventListener('keydown',e=>{ if(e.key==='Enter') login(); });
</script>
